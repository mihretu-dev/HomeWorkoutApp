plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
//    Parcelable to convert data into parcelable object
    id 'kotlin-parcelize'

//    id("com.google.dagger.hilt.android")
//     Protobuf
    id "com.google.protobuf" version "0.9.4"

//    KSP
    id("com.google.devtools.ksp")

}

android {
    namespace 'com.base.androidstartertemplate'
    compileSdk 34

    defaultConfig {
        applicationId "com.base.androidstartertemplate"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions.add('default')
    productFlavors {
        create("production") {
            applicationId 'com.base.androidstartertemplate'
            versionCode 1
            versionName '1.0'
            buildConfigField 'String', 'BASE_URL', "${prod_base_url}"
            buildConfigField 'Boolean', 'LOGGING_ENABLED', "${prod_log_enabled}"

        }

        create("development") {
            applicationId 'com.base.androidstartertemplate.development'
            versionCode 1
            versionName '1.0'
            buildConfigField 'String', 'BASE_URL', "${dev_base_url}"
            buildConfigField 'Boolean', 'LOGGING_ENABLED', "${dev_log_enabled}"

        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.4.3'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:3.24.3"
    }

    // Generates the java Protobuf-lite code for the Protobuf in this project. See
    // https://github.com/google/protobuf-gradle-plugin#customizing-protobuf-compilation
    // for more information.
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {
                    option 'lite'
                }
            }
        }
    }
}

// Declare dependency versions in the ext block
ext {
    compose_version = '1.1.0'
}


dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation platform('androidx.compose:compose-bom:2023.03.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material'
    implementation 'androidx.compose.material:material-icons-extended'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2023.03.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    //Ui controller and window insets
    implementation "com.google.accompanist:accompanist-systemuicontroller:0.27.0"

    // Adding Network Libraries
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Adding Converter Libraries
    implementation 'com.squareup.retrofit2:converter-scalars:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // Adding RXJava Libraries
    implementation 'io.reactivex.rxjava2:rxjava:2.2.19'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation 'com.squareup.retrofit2:adapter-rxjava2:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.3'



//    Navigation
    implementation("androidx.navigation:navigation-compose:2.7.6")

    // WorkManager
    implementation "androidx.work:work-runtime-ktx:2.9.0"

    // For Proto DataStore - store complex data object. It uses protoBuf to serialize and deserialize
    implementation "androidx.datastore:datastore-core:1.0.0"
    implementation "com.google.protobuf:protobuf-javalite:3.24.3"

    // For Preferences DataStore
    implementation "androidx.datastore:datastore-preferences:1.0.0"
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.4.1'
    implementation 'androidx.datastore:datastore-preferences-rxjava2:1.0.0'
    implementation 'androidx.datastore:datastore-preferences-rxjava3:1.0.0'


   /* //  Paging Jetpack Compose
    implementation("androidx.paging:paging-runtime-ktx:3.2.1")

    // RxJava2 support – optional
    implementation ("androidx.paging : paging - rxjava2 : 3.2.1")

    // Guava ListenableFuture support – optional
    implementation ("androidx.paging : paging - guava : 3.2.1")*/

//    RoomDB
    implementation "androidx.room:room-runtime:2.5.2"
    ksp "androidx.room:room-compiler:2.5.2"
    implementation "androidx.room:room-ktx:2.5.2"

    // Lottie Compose
    implementation "com.airbnb.android:lottie-compose:6.1.0"

    // Coil Image & GIF Loading
    implementation "io.coil-kt:coil-compose:2.5.0"
    implementation "io.coil-kt:coil-gif:2.5.0"
}